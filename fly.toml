# fly.toml app configuration file generated for meshworkhq-mellowing-voice-1455 on 2026-06-11T21:10:45+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'meshworkhq-mellowing-voice-1455'
primary_region = 'jnb'
console_command = 'php /var/www/html/artisan tinker'

[build]
  [build.args]
    NODE_VERSION = '22'
    PHP_VERSION = '8.4'

[env]
  APP_ENV = 'production'
  APP_DEBUG = 'false'
  # Change this to the custom domain once it points at the app. Canonical
  # tags, the sitemap and the logo in emails are all built from it.
  APP_URL = 'https://meshworkhq-mellowing-voice-1455.fly.dev'
  MAIL_MAILER = 'resend'
  MAIL_FROM_ADDRESS = 'hello@meshworkhq.com'
  MAIL_FROM_NAME = 'Meshwork HQ'
  FILESYSTEM_DISK = 'local'
  LOG_CHANNEL = 'stderr'
  LOG_LEVEL = 'info'
  LOG_STDERR_FORMATTER = 'Monolog\Formatter\JsonFormatter'
  SESSION_DRIVER = 'cookie'
  SESSION_SECURE_COOKIE = 'true'
  DB_CONNECTION = 'mysql'
  # DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME and DB_PASSWORD are set as Fly
  # secrets, never here: this file is committed.
  QUEUE_CONNECTION = 'sync'

[mounts]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
