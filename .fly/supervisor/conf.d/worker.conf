; Queue worker.
;
; Without this the app runs QUEUE_CONNECTION=sync, which executes queued work
; inline on the request that triggered it. That breaks the alert engine: waves
; 2 and 3 are dispatched with +6h and +24h delays, and a sync connection runs
; them immediately, so every professional is alerted at once and the wave
; system does nothing.
;
; alerts is listed first so the fan-out that decides who hears about a brief
; is never stuck behind a backlog of outbound email.
[program:worker]
priority=10
autostart=true
autorestart=true
user=www-data
command=php /var/www/html/artisan queue:work --queue=alerts,default --sleep=3 --tries=3 --backoff=10 --max-time=3600
; Let an in-flight job finish on deploy rather than killing it mid-send.
stopwaitsecs=60
stdout_events_enabled=true
stderr_events_enabled=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
