; The scheduler.
;
; The image installs cron and writes /etc/cron.d/laravel, but nothing ever
; started the daemon, so `schedule:run` never fired and ExpireOverdueBriefsJob
; never ran: briefs sat Published past their expiry date indefinitely.
[program:cron]
priority=15
autostart=true
autorestart=true
command=cron -f -L 2
stdout_events_enabled=true
stderr_events_enabled=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
